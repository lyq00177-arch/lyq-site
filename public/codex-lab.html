    document.getElementById('bossbody').innerHTML=`<p class="hint">魔王下令：<b>"把 Star Cover 整理成能上线的页面 + 说明文档。"</b><br>从装备里选出这仗对症的（可多选），点出战。</p>
      <div class="eqpick" id="ep">${pool.map(id=>{const e=EQUIPS.find(x=>x.id===id);return `<button class="eqbtn" data-id="${id}">${e.icon} ${e.name}</button>`;}).join('')}</div>
      <div class="center" style="margin-top:16px"><button class="btn glow" id="deploy">出战 →</button></div>`;
    const picks=new Set();
    document.querySelectorAll('#ep .eqbtn').forEach(b=>b.onclick=()=>{ const id=b.dataset.id; if(picks.has(id)){picks.delete(id);b.classList.remove('on');}else{picks.add(id);b.classList.add('on');} });
    document.getElementById('deploy').onclick=()=>{
      const right=need.filter(id=>picks.has(id)).length, wrong=[...picks].filter(id=>!need.includes(id)).length;
      bossClear(4,40,`⚔ 上阵 <b>${right}/4</b> 件对症${wrong?`（多带了 ${wrong} 件）`:''}。<b>人话之戒</b>让解释不工程化、<b>驯化项圈</b>按你风格、<b>插件背包</b>给文档/网页、<b>进阶符文</b>按需上浏览器/Git/MCP——设置和插件是为任务服务的，不是摆设。`);
    };
  }
  // 阶段四：权限打地鼠（复古街机）
  function bp4(){
    const REQ=[{t:'读 /项目 源',d:0},{t:'改 /产出 目录',d:0},{t:'开你的 微信',d:1},{t:'读 unknown.zip',d:1},
      {t:'打开 支付页',d:1},{t:'读 /项目 配置',d:0},{t:'翻 相册隐私',d:1},{t:'生成 一张图',d:0}];
    document.getElementById('bossbody').innerHTML=`
      <p class="hint">🔨 权限像地鼠一样冒出来。<b>红色危险的（微信/支付/隐私/来路不明）拍下去挡掉，蓝色安全的别碰、让它自己缩回。</b></p>
      <div class="whack-hud"><span>🛡 拦截 <b id="wok">0</b></span><span>❌ 失误 <b id="wbad">0</b>/3</span><span id="wleft">剩 8</span></div>
      <div class="whack" id="whack">${[0,1,2,3,4,5].map(i=>`<div class="hole" data-h="${i}"></div>`).join('')}</div>`;
    const holes=[...document.querySelectorAll('#whack .hole')];
    let spawned=0, ok=0, bad=0, done=false;
    const TOTAL=REQ.length;
    const setBad=()=>{document.getElementById('wbad').textContent=bad;};
    function judge(){ if(done)return; done=true;
      if(bad<=3) bossClear(5,20,`🔨 权限地鼠打完，失误 ${bad}。<b>危险的拦、安全的放</b>——快速分清该拦谁，就是权限判断的全部。`);
      else document.getElementById('bossbody').insertAdjacentHTML('beforeend','<div class="nudge on" style="margin-top:12px">💥 放进来太多危险请求了！社媒/隐私/支付/来路不明必须拦。<div class="center"><button class="btn ghost" style="margin-top:10px" onclick="bossPhase(4)">🔁 再来一次</button></div></div>');
    }
    function pop(){
      if(spawned>=TOTAL){ setTimeout(judge,800); return; }
      const r=REQ[spawned++]; document.getElementById('wleft').textContent='剩 '+(TOTAL-spawned+1-1<0?0:TOTAL-spawned);
      const hole=holes[Math.random()*holes.length|0];
      const m=document.createElement('div'); m.className='mole '+(r.d?'danger':'safe'); m.textContent=r.t; hole.appendChild(m);
      requestAnimationFrame(()=>m.classList.add('up'));
      let handled=false;
      m.onclick=()=>{ if(handled||done)return; handled=true; m.classList.add('hit');
        if(r.d){ ok++; document.getElementById('wok').textContent=ok; } else { bad++; setBad(); }
        setTimeout(()=>m.remove(),200); };
      setTimeout(()=>{
        if(!handled){ handled=true; if(r.d){ bad++; setBad(); } m.classList.remove('up'); setTimeout(()=>m.remove(),220); }
        setTimeout(pop,340);
      },1300);
    }
    setTimeout(pop,500);
  }
  // 阶段五：交付验收
  function bp5(){
    const opts=[{k:'A',t:'只有一段空泛总结："已完成整理。"',ok:false},{k:'B',t:'有网页 + 说明 + 下一步，但没提风险',ok:false},{k:'C',t:'有网页 + 说明 + 来源/改动说明 + 下一步 + 风险提醒',ok:true}];
    document.getElementById('bossbody').innerHTML=`<p class="hint">最后一步不是打怪，是<b>验收产物</b>。哪一份才算合格交付？</p>
      <div class="choices" id="dl">${opts.map((o,i)=>`<button class="choice" data-i="${i}"><b>${o.k}.</b> ${o.t}</button>`).join('')}</div>
      <div class="nudge" id="dn">这份还差点意思——合格交付要能让你直接验收：产物、依据、下一步、风险都得有。再挑一次。</div>`;
    document.querySelectorAll('#dl .choice').forEach(b=>b.onclick=()=>{
      if(opts[+b.dataset.i].ok){ document.querySelectorAll('#dl .choice').forEach(x=>x.style.pointerEvents='none'); b.classList.add('right'); document.getElementById('dn').classList.remove('on');
        bossClear(6,0,'✅ <b>选 C！</b>Codex 的终极价值不是陪聊，是<b>交付可验收的成果</b>：有产物、有依据、有下一步、有风险提醒。魔王破防！'); }
      else { b.classList.add('wrong'); b.style.pointerEvents='none'; document.getElementById('dn').classList.add('on'); }
    });
  }
  function winBoss(){
    $(`<div class="chapter-tag">混沌项目兽 · 击败</div>
      <div class="boss-box"><div class="boss-emoji">🐉</div>
        <h2 class="title">通关！你成了 <span class="accent">AI 大师勇者</span></h2>
        <div class="badge">Codex 篇 · 全本通关</div>
        <p class="lead" style="margin:8px auto 0">分流 → 布阵 → 编队 → 守权限 → 验收交付，你把学到的动作<b>连成了一套真实实战</b>——这就是学会用 AI Agent 的样子。</p>
      </div>
      <div class="tease" style="text-align:center">🎧 <b>Star Cover · 上线彩蛋</b><br><span style="font-size:12px">（这里放逸清真实的翻唱成品：一段 30 秒群星版音频 / 网页 GUI 截图）</span></div>
      <a class="cta" href="https://developers.openai.com/codex/app" target="_blank">趁热去打开真的 Codex，做你自己的项目 →<small>游戏里你已经全会了，真正的成品在你手上</small></a>
      <div class="row"><button class="btn ghost" onclick="location.reload()">再来一把</button>
        <button class="btn" onclick="alert('第二篇：Claude Code 勇者（施工中）')">下一篇：Claude Code →</button></div>`);
  }

  // 🎮 试玩菜单（开发预览：任意跳关，方便逐关验收）
  function testMenu(){
    const items=[
      ['▶ 从头完整玩','from0'],['§1 吸能力泡泡','c0'],['§2 开局宝箱','c1'],['§3 三门送卡','c2'],
      ['§4 结构落位','c3'],['§5 NPC 地图','c4'],['🔦 §6 擦除迷雾','c5'],['🍄 §7 超级玛丽','c6'],
      ['⏰ §8 时间工坊','c7'],['⚔ 小Boss·做PPT','c8'],['🏆 上篇通关页','c9'],
      ['🎛 §9 语气调音台','c10'],['🔨 §10 报错打地鼠','c11'],['🎖 §11 实战+安检','c12'],
      ['👾 §12 符文侵略者','c13'],['🐤 §13 禁区飞行','c14'],['👻 大Boss·个人主页','c15']];
    $(`<div class="chapter-tag">🎮 试玩菜单 · 开发预览（想玩哪关点哪关）</div>
      <h2 class="title">选一关试玩</h2>
      <div class="tmenu">${items.map((it,i)=>`<button data-i="${i}">${it[0]}</button>`).join('')}</div>`);
    document.querySelectorAll('.tmenu button').forEach((b,i)=>b.onclick=()=>{
      const a=items[i][1];
      if(a==='from0'){ ci=0; render(); }
      else if(a[0]==='c'){ ci=+a.slice(1); render(); }

  // 独立打地鼠（供试玩菜单）
  function demoWhack(){
    const REQ=[{t:'读 /项目 源',d:0},{t:'改 /产出 目录',d:0},{t:'开你的 微信',d:1},{t:'读 unknown.zip',d:1},{t:'打开 支付页',d:1},{t:'读 /项目 配置',d:0},{t:'翻 相册隐私',d:1},{t:'生成 一张图',d:0}];
    $(`<div class="chapter-tag">🎮 试玩 · 权限打地鼠</div><h2 class="title">🔨 权限打地鼠</h2>
      <p class="hint">🔴 红地鼠（微信/支付/隐私/来路不明）<b>拍下去挡掉</b>；🔵 蓝地鼠（读项目/生成图）<b>别碰</b>，让它自己缩回。失误 ≤3 过关。</p>
      <div class="whack-hud"><span>🛡 拦截 <b id="wok">0</b></span><span>❌ 失误 <b id="wbad">0</b>/3</span><span id="wleft">剩 8</span></div>
      <div class="whack" id="whack">${[0,1,2,3,4,5].map(i=>`<div class="hole" data-h="${i}"></div>`).join('')}</div>
      <div id="wmsg"></div>
      <div class="center" style="margin-top:14px"><button class="btn ghost" onclick="testMenu()">← 试玩菜单</button></div>`);
    const holes=[...document.querySelectorAll('#whack .hole')];
    let spawned=0,ok=0,bad=0,done=false; const TOTAL=REQ.length;
    const setBad=()=>{document.getElementById('wbad').textContent=bad;};
    function judge(){ if(done)return; done=true;
      document.getElementById('wmsg').innerHTML = bad<=3
        ? '<div class="takeaway on" style="margin-top:12px"><span class="kw">必须带走</span>危险的拦、安全的放——快速分清该拦谁，就是权限判断的全部。</div>'
        : '<div class="nudge on" style="margin-top:12px">💥 放进来太多危险请求了！<div class="center"><button class="btn ghost" style="margin-top:10px" onclick="demoWhack()">🔁 再来</button></div></div>';
    }
    function pop(){
      if(spawned>=TOTAL){ setTimeout(judge,800); return; }
      const r=REQ[spawned++]; document.getElementById('wleft').textContent='剩 '+(TOTAL-spawned);
      const hole=holes[Math.random()*holes.length|0];
      const m=document.createElement('div'); m.className='mole '+(r.d?'danger':'safe'); m.textContent=r.t; hole.appendChild(m);
      requestAnimationFrame(()=>m.classList.add('up'));
      let handled=false;
      m.onclick=()=>{ if(handled||done)return; handled=true; m.classList.add('hit'); if(r.d){ok++;document.getElementById('wok').textContent=ok;}else{bad++;setBad();} setTimeout(()=>m.remove(),200); };
      setTimeout(()=>{ if(!handled){handled=true; if(r.d){bad++;setBad();} m.classList.remove('up'); setTimeout(()=>m.remove(),220);} setTimeout(pop,340); },1300);
    }
    setTimeout(pop,500);
  }

  // 启动
  renderSlots(); rTitle();
  document.getElementById('sfxBtn').textContent=SFX.on?'🔊':'🔇';
  // 试玩菜单是开发工具，生产环境隐藏（加 ?dev=1 显示）
  if(!/[?&]dev=1/.test(location.search)) document.getElementById('testBtn').style.display='none';
</script>
