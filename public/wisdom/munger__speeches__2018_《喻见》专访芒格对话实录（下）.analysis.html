<p>问什么是成功，芒格的回答堵住了所有成功学的嘴：取决于你到底想要什么。</p>
<p>他说自己是极少数两次通读孔子的西方人，喜欢孔子不为赚钱，而是想搞懂这个世界如何运作。一个美国资本家把儒家当精神底座，这事本身就够你想很久。</p>
<p>谈苹果那段最见功力。记者追问：是苹果变了，还是伯克希尔变了？他不绕——苹果对我们来说更像电子消费品，不是高科技股，沃伦理解消费品胜过理解软件。同一笔投资，归类框架不同，结论就天差地别。能力圈从来不是行业标签，是你究竟真懂什么。</p>
<p>还有手握上千亿现金，他给的理由平淡得可怕：因为找不到别的好东西。耐心不是什么美德，是没货时绝不将就的纪律。</p>
