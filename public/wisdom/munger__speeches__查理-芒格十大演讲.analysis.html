<p>1986 年，芒格在一场中学毕业典礼上，发表了他自称「这辈子唯一的演讲」。</p>
<p>别人都教毕业生「如何获得幸福」，他偏要反过来讲——如何才能保证过上痛苦的一生。这就是他标志性的逆向思维：想要幸福，先把通往痛苦的路一条条标出来，然后绕开它。</p>
<p>他借用喜剧演员卡森的「痛苦处方」：靠化学物质改变心情、妒忌、怨恨。他说自己年轻时四个最聪明正直的好友，有两个因酒精早逝。这不是段子，是真实的代价。其中妒忌尤其蠢——它是唯一一种让你毫无快感、纯粹自我折磨的罪。</p>
<p>我特别服他这套打法：与其追问「怎么成功」，不如死磕「怎么必败」，然后一样样避开。能不输的人，时间久了自然就赢——这和他一生的投资逻辑，根本是同一个。</p>
