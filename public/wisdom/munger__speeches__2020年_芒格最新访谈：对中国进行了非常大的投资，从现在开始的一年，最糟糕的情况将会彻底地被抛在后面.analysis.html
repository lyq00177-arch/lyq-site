<p>这篇标题在喊「看多中国」，但真正扎心的，是他对「全民炒股」的态度。</p>
<p>芒格说，他年轻时身边没几个聪明人，现在几乎人人都聪明，全被钱吸引进了投资圈。然后他撂下一句很不合时宜的话——我根本不欢迎这件事，我不希望整个世界都想着用这种方式致富。一个靠投资封神的人，公开说不希望人人都来投资，这份清醒挺罕见。</p>
<p>他还坦白前沿科技「既是机会，也是杀手」，自己第一次投科技公司差点把命赔进去，从此长期躲着不碰。能力圈的边界，是用真金白银的疼换来的，不是想出来的。</p>
<p>最实在的是开头那句：选对职业生涯，比什么都重要——做你既喜欢又擅长的事，你就自带优势。投资如此，人生更如此。</p>
