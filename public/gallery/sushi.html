<script type="module">

const ERAS = {
  "密州": "密州时期 1074–1076 · 意气与深情",
  "黄州": "黄州时期 1080–1084 · 绝境中的巅峰",

};

// 作者介绍（事实来自 lyq017.cn /moe /portfolio）
const AUTHOR = [
  { t:"关 于 作 者", size:56, color:"#d4a853", weight:500, gap:56 },
  { t:"凌逸清 Harry · 常州人", size:40, color:"#e8e3d8", weight:500, gap:44 },
  { t:"AI 创作者 · 投资人 · 超级个体实践者", size:30, color:"#9a9186", weight:300, gap:64 },
  { t:"本系列以苏轼各时期词作意境为本，", size:32, color:"#c9c2b4", weight:300, gap:44 },
  { t:"由 AI 重绘为宽银幕电影画面。", size:32, color:"#c9c2b4", weight:300, gap:64 },
  { t:"公元 1101 年，苏轼终老于常州。", size:32, color:"#c9c2b4", weight:300, gap:44 },
  { t:"九百年后，一个常州人", size:32, color:"#c9c2b4", weight:300, gap:44 },
  { t:"用 AI 重新点亮了他的月色。", size:32, color:"#d4a853", weight:400, gap:0 },
];

const CW = 9, CH = 4.8, EYE = 1.6;
const ART_H = 2.3, MAX_W = 5.4, PAD = 0.7;

// ── 布局：沿 -z 交替左右墙，压轴上端墙 ──
const wallItems = EXHIBITS.filter(e => !e.endWall);
const finale = EXHIBITS.find(e => e.endWall);
let cursor = -7;                      // 给入口区（标题墙+作者墙）留空间
const placed = [];
wallItems.forEach((e, i) => {
  const side = "left";                // 单侧动线：沿左墙按时间顺序一幅幅看过去
  const w = MAX_W;
  placed.push({ ...e, side, zc: cursor - PAD - w/2, w });
  cursor -= PAD + w;
});
const endZ = cursor - PAD - 6;
const LEN = -endZ + 12;
const midZ = (6 + endZ) / 2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.Fog(0x0a0a0a, 16, 50);

const camera = new THREE.PerspectiveCamera(66, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, EYE, 3.5);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── 结构 ──
const wallMat  = new THREE.MeshStandardMaterial({ color:0x1c1915, roughness:.92 });
const floorMat = new THREE.MeshStandardMaterial({ color:0x0e0d0b, roughness:.35, metalness:.25 });
const ceilMat  = new THREE.MeshStandardMaterial({ color:0x0b0a09, roughness:1 });

const floor = new THREE.Mesh(new THREE.PlaneGeometry(CW, LEN), floorMat);
floor.rotation.x = -Math.PI/2; floor.position.z = midZ; floor.receiveShadow = true; scene.add(floor);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(CW, LEN), ceilMat);
ceil.rotation.x = Math.PI/2; ceil.position.set(0, CH, midZ); scene.add(ceil);
function mkWall(w, h, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m);
}
mkWall(LEN, CH, -CW/2, CH/2, midZ,  Math.PI/2);
mkWall(LEN, CH,  CW/2, CH/2, midZ, -Math.PI/2);
mkWall(CW, CH, 0, CH/2, 6, Math.PI);
mkWall(CW, CH, 0, CH/2, endZ, 0);

const stripMat = new THREE.MeshBasicMaterial({ color:0xd4a853 });
for (const x of [-CW/4, CW/4]) {
  const strip = new THREE.Mesh(new THREE.BoxGeometry(.12, .06, LEN*0.96), stripMat);
  strip.position.set(x, CH-.02, midZ); scene.add(strip);
}

scene.add(new THREE.AmbientLight(0xfff2dd, .42));
const nLights = Math.ceil(LEN / 11);
for (let i = 0; i < nLights; i++) {
  const z = 6 - (i + .5) * (LEN / nLights);
  const p = new THREE.PointLight(i % 3 === 1 ? 0xd4a853 : 0xfff0d8, 26, 20, 1.5);
  p.position.set(0, CH-1, z); scene.add(p);
}

// ── 装饰（全部为代码几何体，零外部资源）──
// 踢脚线
const skirtMat = new THREE.MeshStandardMaterial({ color:0x2a251f, roughness:.5, metalness:.4 });
for (const sx of [-1, 1]) {
  const skirt = new THREE.Mesh(new THREE.BoxGeometry(.05, .18, LEN*0.99), skirtMat);
  skirt.position.set(sx*(CW/2-.025), .09, midZ); scene.add(skirt);
}
// 中央地毯（暗红长绒）
const carpet = new THREE.Mesh(
  new THREE.PlaneGeometry(2.6, LEN*0.92),
  new THREE.MeshStandardMaterial({ color:0x3a1512, roughness:.98 })
);
carpet.rotation.x = -Math.PI/2; carpet.position.set(0, .012, midZ); scene.add(carpet);
// 地毯金边
for (const sx of [-1, 1]) {
  const trim = new THREE.Mesh(
    new THREE.PlaneGeometry(.08, LEN*0.92),
    new THREE.MeshStandardMaterial({ color:0x8a6a30, roughness:.6, metalness:.5 })

  trim.rotation.x = -Math.PI/2; trim.position.set(sx*1.34, .013, midZ); scene.add(trim);
}
// 博物馆长凳（两张，均布长廊）
const woodMat = new THREE.MeshStandardMaterial({ color:0x241d15, roughness:.55, metalness:.15 });
function bench(z) {
  const seat = new THREE.Mesh(new THREE.BoxGeometry(2.4, .12, .55), woodMat);
  seat.position.set(0, .46, z); scene.add(seat);
  for (const sx of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(.1, .4, .5), woodMat);
    leg.position.set(sx*1.0, .2, z); scene.add(leg);
  }
}
bench(midZ + LEN*0.18); bench(midZ - LEN*0.18);

// ── 文字工具：多行 canvas 面板 ──
function panelTexture(items, W=1024, H=1024, align="center") {
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const total = items.reduce((a,it) => a + it.size + (it.gap||0), 0);
  let y = (H - total) / 2;
  g.textAlign = align; g.textBaseline = "top";
  const x = align === "center" ? W/2 : 60;
  for (const it of items) {
    g.fillStyle = it.color || "#e8e3d8";
    const serif = it.serif ? "'Noto Serif SC', serif" : "'Noto Sans SC', sans-serif";
    g.font = `${it.weight||300} ${it.size}px ${serif}`;
    g.fillText(it.t, x, y);
    y += it.size + (it.gap || 0);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8;
  return tex;
}

// ── 入口标题墙（南端墙，进场回头可见）+ 作者墙（入口右侧一段） ──
const titleTex = panelTexture([

}

// ── 右墙：苏轼年表（与左墙画作对望）──
const TIMELINE = [
  ["1037", "生于眉山", "父苏洵、弟苏辙，一门三杰"],
  ["1057", "进士及第", "主考欧阳修误以为是门生曾巩之作，避嫌取第二"],
  ["1061", "制科入三等", "宋开国百年间最高等，人称「百年第一」"],
  ["1066", "父洵病逝", "扶柩还蜀，守孝三年"],
  ["1071", "通判杭州", "反对新法自请外放；「欲把西湖比西子」"],
  ["1074", "知密州", "出猎、记梦、中秋问月——本展前四幅皆出于此"],
  ["1077", "知徐州", "黄河决口，亲率军民抗洪，筑黄楼"],
  ["1079", "乌台诗案", "因诗文下狱一百三十日，几死"],
  ["1080", "贬谪黄州", "躬耕东坡，自号东坡居士；定风波、赤壁皆成于此"],
  ["1085", "起复还朝", "高太后垂帘，官至翰林学士知制诰"],
  ["1089", "再守杭州", "疏浚西湖，筑长堤——今日苏堤"],
  ["1094", "再贬惠州", "「日啖荔枝三百颗，不辞长作岭南人」"],
  ["1097", "渡海贬儋州", "在海南办学授业，儋州文脉自此而开"],
  ["1100", "遇赦北归", "「九死南荒吾不恨，兹游奇绝冠平生」"],
  ["1101", "卒于常州", "终点即本展终点：问汝平生功业，黄州惠州儋州"],
];
{
  const tlStart = -6, tlEnd = endZ + 5;
  // 金色年表线
  const line = new THREE.Mesh(
    new THREE.BoxGeometry(.04, .02, Math.abs(tlEnd - tlStart)),
    new THREE.MeshBasicMaterial({ color:0xd4a853 })
  );
  line.position.set(CW/2 - .05, 2.62, (tlStart + tlEnd) / 2);

  const tlTitle = new THREE.Mesh(
    new THREE.PlaneGeometry(2.6, .5),
    new THREE.MeshBasicMaterial({ map: panelTexture([{ t:"苏 轼 年 表", size:76, color:"#d4a853", weight:600, serif:true }], 1024, 200), transparent:true })
  );
  tlTitle.position.set(CW/2 - .05, 3.55, tlStart - .5);
  tlTitle.rotation.y = -Math.PI/2; scene.add(tlTitle);
  TIMELINE.forEach(([year, event, note], i) => {

    // 节点圆点

      new THREE.MeshBasicMaterial({ color:0xd4a853 }));
    dot.position.set(CW/2 - .07, 2.62, z); scene.add(dot);
    // 年份在线上方，事件在线下方
    const plate = new THREE.Mesh(
      new THREE.PlaneGeometry(2.6, 1.7),
      new THREE.MeshBasicMaterial({ map: panelTexture([
        { t: year, size:82, color:"#d4a853", weight:700, gap:24 },
        { t: event, size:52, color:"#e8e3d8", weight:500, gap:28, serif:true },
        { t: note, size:30, color:"#8a8278", weight:300 },
      ], 1024, 672), transparent:true })
    );
    plate.position.set(CW/2 - .05, 1.85, z);
    plate.rotation.y = -Math.PI/2; scene.add(plate);

}

// ── 展签 ──
function placardTexture(e) {
  const items = [
    { t:e.title, size:58, color:"#d4a853", weight:600, gap:26, serif:true },
    { t:e.meta, size:30, color:"#8a8278", weight:300, gap:44 },
    ...e.lines.map((l,i) => ({ t:l, size:38, color:"#e8e3d8", weight:400, gap:i===e.lines.length-1?44:22, serif:true })),
    { t:"— " + e.note + " —", size:26, color:"#8a8278", weight:300, gap:0 },
  ];
  return panelTexture(items, 1280, 640);
}

// ── 挂画 + 展签 ──
const loader = new THREE.TextureLoader();
let loadedCount = 0;
function onTexLoaded() {
  if (++loadedCount >= EXHIBITS.length) {
    const el = document.getElementById("loading");
    el.style.opacity = 0; setTimeout(() => el.remove(), 900);
  }
}
function hang(e, pos, ry) {
  loader.load(e.src, (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    const ar = tex.image.width / tex.image.height;
    let w = e.w ?? MAX_W, h = w / ar;
    if (h > ART_H + .4) { h = ART_H + .4; w = h * ar; }
    const nx = Math.sin(ry), nz = Math.cos(ry);
    const frame = new THREE.Mesh(
      new THREE.BoxGeometry(w + .12, h + .12, .05),
      new THREE.MeshStandardMaterial({ color:0x2a251f, roughness:.4, metalness:.6 })
    );
    frame.position.set(pos.x + nx*.03, 2.55, pos.z + nz*.03);
    frame.rotation.y = ry; frame.castShadow = true; scene.add(frame);
    const art = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ map: tex })
    );
    art.position.set(pos.x + nx*.07, 2.55, pos.z + nz*.07);
    art.rotation.y = ry; scene.add(art);
    // 画灯：画框上方金色灯杆 + 射灯洗墙
    const bar = new THREE.Mesh(
      new THREE.CylinderGeometry(.025, .025, Math.min(w*.7, 3.2)),
      new THREE.MeshStandardMaterial({ color:0xd4a853, roughness:.3, metalness:.9 })
    );
    bar.rotation.z = Math.PI/2; bar.rotation.y = ry;
    bar.position.set(pos.x + nx*.22, 2.55 + h/2 + .26, pos.z + nz*.22); scene.add(bar);
    const spot = new THREE.SpotLight(0xfff0d8, 34, 10, .58, .5, 1.6);
    spot.position.set(pos.x + nx*1.6, CH-.35, pos.z + nz*1.6);
    spot.target.position.set(pos.x, 2.2, pos.z);
    spot.castShadow = true; spot.shadow.mapSize.set(512,512);
    scene.add(spot); scene.add(spot.target);
    // 射灯光锥（体积光效果，加色混合）
    const coneH = 2.6;
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(1.5, coneH, 24, 1, true),
      new THREE.MeshBasicMaterial({ color:0xffe8bb, transparent:true, opacity:.028, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide })
    );
    cone.position.set(pos.x + nx*1.25, CH-.35-coneH/2, pos.z + nz*1.25);
    cone.lookAt(pos.x, 2.2, pos.z);
    cone.rotateX(-Math.PI/2);
    scene.add(cone);
    // 展签：画下方，博物馆规格
    const placard = new THREE.Mesh(
      new THREE.PlaneGeometry(3.0, 1.5),
      new THREE.MeshBasicMaterial({ map: placardTexture(e), transparent:true })
    );
    placard.position.set(pos.x + nx*.05, .92, pos.z + nz*.05);
    placard.rotation.y = ry; scene.add(placard);
    onTexLoaded();
  }, undefined, onTexLoaded);
}
// 侧墙七幅
let lastEra = null;
for (const e of placed) {
  const isLeft = e.side === "left";
  const wallX = isLeft ? -CW/2 : CW/2;
  const ry = isLeft ? Math.PI/2 : -Math.PI/2;
  hang(e, { x:wallX, z:e.zc }, ry);
  // 时期铭牌：该时期第一件展品上方
  if (e.era !== lastEra) {
    lastEra = e.era;
    const eraPlate = new THREE.Mesh(
      new THREE.PlaneGeometry(4.4, .5),
      new THREE.MeshBasicMaterial({ map:panelTexture([{ t:ERAS[e.era], size:56, color:"#d4a853", weight:400 }], 1400, 160), transparent:true })
    );
    eraPlate.position.set(wallX + (isLeft?1:-1)*.03, 4.52, e.zc);
    eraPlate.rotation.y = ry; scene.add(eraPlate);
  }
}
// 压轴：尽头端墙
hang(finale, { x:0, z:endZ }, 0);
const finaleEra = new THREE.Mesh(
  new THREE.PlaneGeometry(4.4, .5),
  new THREE.MeshBasicMaterial({ map:panelTexture([{ t:ERAS["终章"], size:56, color:"#d4a853", weight:400 }], 1400, 160), transparent:true })
);
finaleEra.position.set(0, 4.52, endZ + .03); scene.add(finaleEra);

// ── 传送目录 ──
const menu = document.getElementById("menu");
let menuEra = null;
for (const e of [...placed, finale]) {
  if (e.era !== menuEra) {
    menuEra = e.era;
    const div = document.createElement("div");
    div.className = "era"; div.textContent = ERAS[e.era];
    menu.appendChild(div);
  }
  const btn = document.createElement("button");
  btn.textContent = e.title;
  btn.onclick = () => {
    if (e.endWall) { camera.position.set(0, EYE, endZ + 6); yaw = 0; }
    else {
      camera.position.set(e.side === "left" ? 1.2 : -1.2, EYE, e.zc);
      yaw = e.side === "left" ? Math.PI/2 : -Math.PI/2;
    }
    pitch = 0;
  };
  menu.appendChild(btn);
}

// ── 控制（同 v3）──
let yaw = 0, pitch = 0;
const keys = {};
addEventListener("keydown", e => keys[e.code] = true);
addEventListener("keyup",   e => keys[e.code] = false);
let dragging = false, px = 0, py = 0;
const cv = renderer.domElement;
cv.addEventListener("pointerdown", e => { dragging = true; px = e.clientX; py = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (!dragging) return;
  yaw -= (e.clientX - px) * .0042; pitch -= (e.clientY - py) * .0032;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
  px = e.clientX; py = e.clientY;
});
cv.addEventListener("pointerup", () => dragging = false);
const joy = document.getElementById("joy");
const knob = joy.querySelector(".knob");
let joyVec = { x:0, y:0 };
joy.addEventListener("pointerdown", e => { joy.setPointerCapture(e.pointerId); moveKnob(e); e.stopPropagation(); });
joy.addEventListener("pointermove", e => { if (joy.hasPointerCapture(e.pointerId)) moveKnob(e); });
joy.addEventListener("pointerup", () => { joyVec = {x:0,y:0}; knob.style.transform = "translate(-50%,-50%)"; });
function moveKnob(e) {
  const r = joy.getBoundingClientRect();
  let dx = e.clientX - (r.left+r.width/2), dy = e.clientY - (r.top+r.height/2);
  const len = Math.hypot(dx,dy), max = r.width/2 - 20;
  if (len > max) { dx *= max/len; dy *= max/len; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyVec = { x: dx/max, y: dy/max };
}
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05);
  const speed = keys.ShiftLeft || keys.ShiftRight ? 9 : 4.8;
  let fw = 0, st = 0;
  if (keys.KeyW || keys.ArrowUp) fw += 1;
  if (keys.KeyS || keys.ArrowDown) fw -= 1;
  if (keys.KeyA || keys.ArrowLeft) st -= 1;
  if (keys.KeyD || keys.ArrowRight) st += 1;
  fw += -joyVec.y; st += joyVec.x;
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  camera.position.x += (sin*-fw + cos*st) * speed * dt;
  camera.position.z += (cos*-fw - sin*st) * speed * dt;
  camera.position.x = Math.max(-CW/2+.7, Math.min(CW/2-.7, camera.position.x));
  camera.position.z = Math.max(endZ+.9, Math.min(5.2, camera.position.z));
  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw; camera.rotation.x = pitch;
  renderer.render(scene, camera);
}
tick();
addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
setTimeout(() => document.getElementById("hint").style.opacity = 0, 7000);
</script>
