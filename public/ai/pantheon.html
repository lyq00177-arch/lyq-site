function arhat(x, z, ry, seed) {
  const g = new THREE.Group();
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(.7, .35, .7), stoneMat);
  plinth.position.y = .175; g.add(plinth);
  const body = new THREE.Mesh(new THREE.ConeGeometry(.34, .85, 12), bronzeMat);
  body.position.y = .78; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.17, 12, 10), bronzeMat);
  head.position.y = 1.32; g.add(head);
  // 姿态微差：或合掌（小球）或持杖（细柱）
  if (seed % 3 === 0) {
    const staff = new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,1.1,6), goldMat);
    staff.position.set(.28, .9, .1); g.add(staff);
  } else {
    const hands = new THREE.Mesh(new THREE.SphereGeometry(.09, 8, 8), bronzeMat);
    hands.position.set(0, .82, .28); g.add(hands);
  }
  const halo = new THREE.Mesh(new THREE.TorusGeometry(.22,.02,6,24),
    new THREE.MeshBasicMaterial({ color:0xd4a853, transparent:true, opacity:.7 }));
  halo.position.set(0, 1.32, -.12); g.add(halo);
  g.position.set(x, 0, z);
  g.rotation.y = ry + (seed%5-2)*.06;
  scene.add(g);
}

function wallPanel(items, w, h, x, z, ry) {
  const m = new THREE.Mesh(

}
function textTexPanel(lines, W, H) {
  const c = document.createElement("canvas"); c.width=W; c.height=H;
  const g = c.getContext("2d");
  const total = lines.reduce((a,l)=>a+l.size+(l.gap||0),0);
  let y = (H-total)/2;
  g.textAlign="center"; g.textBaseline="top";
  for (const l of lines) {
    g.fillStyle = l.color||"#c9c2b4";
    g.font = `${l.weight||300} ${l.size}px ${l.serif?"'Noto Serif SC',serif":"'Noto Sans SC',sans-serif"}`;
    g.fillText(l.t, W/2, y); y += l.size + (l.gap||0);
  }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t;
}

  { t:"香火为演示数据 · 佛祖暂不上链", size:26, color:"#8a8278", gap:0 },
], 5.2, 5.2, HALL_W/2-.05, 17.5, -Math.PI/2);

// ── 文字纹理 ──
function textTex(lines, W=512, H=512) {
  const c = document.createElement("canvas"); c.width=W; c.height=H;
  const g = c.getContext("2d");
  const total = lines.reduce((a,l)=>a+l.size+(l.gap||0),0);
  let y = (H-total)/2;
  g.textAlign="center"; g.textBaseline="top";
  for (const l of lines) {
    g.fillStyle = l.color||"#e8e3d8";
    g.font = `${l.weight||400} ${l.size}px ${l.serif?"'Noto Serif SC',serif":"'Noto Sans SC',sans-serif"}`;
    g.fillText(l.t, W/2, y); y += l.size + (l.gap||0);
  }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t;
}

// ── 烟雾粒子材质（共享贴图）──
function smokeTex() {
  const c = document.createElement("canvas"); c.width=c.height=64;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(32,32,2,32,32,30);
  grad.addColorStop(0,"rgba(230,220,200,.55)"); grad.addColorStop(1,"rgba(230,220,200,0)");
  g.fillStyle = grad; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
const SMOKE_TEX = smokeTex();
const smokes = [];   // {sprite, vy, life}
function puff(x,y,z,n=1,spread=.12){
  for(let i=0;i<n;i++){
    const m = new THREE.SpriteMaterial({ map:SMOKE_TEX, transparent:true, opacity:.5, depthWrite:false });
    const s = new THREE.Sprite(m);
    s.position.set(x+(Math.random()-.5)*spread, y, z+(Math.random()-.5)*spread);
    const sc = .18+Math.random()*.15; s.scale.set(sc,sc,1);
    scene.add(s);
    smokes.push({ s, vy:.35+Math.random()*.25, life:2.2+Math.random()*1.2, t:0 });
  }
}

// ── 神龛 ──
const altarGroups = [];   // { grp, god, plaque, burnerPos }
function plaqueTex(god, rank) {
  return textTex([
    { t: rank===0 ? "☁ C 位 ☁" : `第 ${rank+1} 位`, size:28, color:"#8a8278", gap:14 },
    { t: god.name, size:60, color:"#d4a853", weight:700, gap:16 },
    { t: god.desc, size:27, color:"#c9c2b4", gap:20 },
    ...(god.intro||[]).map((l,i)=>({ t:l, size:22, color:"#9a9186", gap:i===(god.intro.length-1)?22:10 })),
    { t: `香火 ${god.incense}`, size:32, color:"#ff9a4d", weight:500 },
  ], 512, 420);
}

function buildAltar(god, rank) {
  const grp = new THREE.Group();
  const big = rank === 0;
  const S = big ? 1.7 : 1;
  // 基座
  const base = new THREE.Mesh(new THREE.BoxGeometry(2.2*S, .5*S, 1.4*S), woodMat);
  base.position.y = .25*S; grp.add(base);
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.9*S, .9*S, 1.2*S), woodMat);
  top.position.y = .95*S; grp.add(top);
  // 佛光环
  const halo = new THREE.Mesh(new THREE.TorusGeometry(.75*S,.05*S,8,40), goldMat);
  halo.position.y = 2.35*S; grp.add(halo);
  // 顶部 logo 圆牌（默认名号首字，logo 加载成功后替换）
  const fo = new THREE.Mesh(
    new THREE.CircleGeometry(.62*S, 40),
    new THREE.MeshBasicMaterial({ map: textTex([{ t: god.name.slice(0,2), size:130, color:"#d4a853", weight:700 }], 256, 256), transparent:true })
  );
  fo.position.set(0, 2.35*S, .02); grp.add(fo);
  if (god.logoData) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = 256;
      const g = c.getContext("2d");
      g.drawImage(img, 24, 24, 208, 208);
      fo.material.map = new THREE.CanvasTexture(c);
      fo.material.needsUpdate = true;
    };
    img.onerror = () => document.getElementById('dbg').textContent += ` [${god.name} logo 解码失败]`;
    img.src = god.logoData;
  }
  // 名牌
  const plaque = new THREE.Mesh(
    new THREE.PlaneGeometry(2.0*S, 1.64*S),
    new THREE.MeshBasicMaterial({ map: plaqueTex(god, rank), transparent:true })
  );
  plaque.position.set(0, 1.62*S, .75*S); grp.add(plaque);
  // 香炉
  const burner = new THREE.Mesh(new THREE.CylinderGeometry(.16*S,.2*S,.22*S,16), goldMat);
  burner.position.set(0, .62*S, .85*S); grp.add(burner);
  // 功德箱
  const box = new THREE.Mesh(new THREE.BoxGeometry(.55*S,.4*S,.4*S), woodMat);
  box.position.set(.85*S, .2*S, .9*S); grp.add(box);
  const slot = new THREE.Mesh(new THREE.BoxGeometry(.3*S,.02,.06), goldMat);
  slot.position.set(.85*S, .41*S, .9*S); grp.add(slot);
  const boxLabel = new THREE.Mesh(new THREE.PlaneGeometry(.5*S,.18*S),
    new THREE.MeshBasicMaterial({ map: textTex([{ t:"功德箱", size:110, color:"#d4a853", weight:600, serif:true }], 512, 180), transparent:true }));
  boxLabel.position.set(.85*S, .22*S, 1.101*S); grp.add(boxLabel);
  grp.userData = { god, rank, burnerLocal: new THREE.Vector3(0,.78*S,.85*S) };
  scene.add(grp);
  return { grp, god, plaque, S };
}

// 排位 → 目标位置：rank0 C位尽头居中；其余背靠立柱、面朝过道
// 立柱 z = 14 - row*7（row 0..5）；名次越高越靠近 C 位（z 越小）
function rankPos(rank) {
  if (rank === 0) return { x:0, z:-HALL_D/2+3.2, ry:0 };
  const i = rank-1;
  const side = i%2===0 ? -1 : 1;          // 左右交替
  const row = Math.floor(i/2);             // 主位面前最近的柱排起，绝不在主位身后
  return { x: side*5.05, z: -14 + row*7, ry: side===-1 ? Math.PI/2 : -Math.PI/2 };
}

function sortGods(){ gods = [...gods].sort((a,b)=>b.incense-a.incense); }
sortGods();
gods.forEach((god, rank) => {
  const a = buildAltar(god, rank);
  const p = rankPos(rank);
  a.grp.position.set(p.x, 0, p.z);
  a.grp.rotation.y = p.ry;
  a.target = p;
  altarGroups.push(a);
});

// C 位云雾：漂浮烟雾 sprite 常驻
const cpos = rankPos(0);
setInterval(()=> puff(cpos.x+(Math.random()-.5)*3, 1.2+Math.random()*2.2, cpos.z+ .5+Math.random()*1.5, 1, 2.5), 380);

// ── 排行榜 UI ──
const rankBox = document.getElementById("rank");
function refreshRank(){
  rankBox.querySelectorAll(".row").forEach(el=>el.remove());
  gods.forEach((g,i)=>{
    const d = document.createElement("div"); d.className="row";
    d.innerHTML = `<span class="n">${i+1}</span><span>${g.name}</span><span class="cnt">🔥${g.incense}</span>`;
    d.onclick = ()=> { const a = altarGroups.find(a=>a.god===g);
      camera.position.set(a.target.x*.4, EYE, a.target.z+4.5); yaw = Math.atan2(a.target.x*.6, -4.5) + Math.PI; pitch = 0; };
    rankBox.appendChild(d);
  });
}
refreshRank();

// ── 上香：点击神龛 ──
const ray = new THREE.Raycaster();
const toast = document.getElementById("toast");
let toastTimer;
// ── 全网香火同步 ──
const API = "/api/shrine";
let online = false;
const syncEl = document.getElementById("syncState");
async function pullCounts(){
  try {
    const r = await fetch(API + "/counts", { signal: AbortSignal.timeout(6000) });
    const counts = await r.json();
    gods.forEach(g => { if (typeof counts[g.name] === "number") g.incense = counts[g.name]; });
    online = true;
    syncEl.textContent = "🌐 全网共修 · 已连线";
    applyCounts();
  } catch {
    online = false;
    syncEl.textContent = "⚠︎ 离线模式 · 香火仅存本机";
  }
}
function applyCounts(){
  sortGods();
  gods.forEach((g,rank)=>{
    const ag = altarGroups.find(x=>x.god===g);
    if (!ag) return;
    ag.target = rankPos(rank);
    ag.plaque.material.map = plaqueTex(g, rank);
    ag.plaque.material.map.needsUpdate = true;
  });
  refreshRank();
}
async function pushWorship(god, n){
  if (!online) return;
  try {
    const r = await fetch(API + "/worship", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ name: god.name, n }),
      signal: AbortSignal.timeout(6000),
    });
    const data = await r.json();
    if (data.counts) {
      gods.forEach(g => { if (typeof data.counts[g.name] === "number") g.incense = data.counts[g.name]; });
      applyCounts();
    }
  } catch { /* 掉线不打断参拜 */ }
}
pullCounts();
setInterval(pullCounts, 30000);   // 每 30 秒同步一次别人的香火

// ── 参拜动作 ──
const anims = [];   // { update(dt)->bool 存活 }
function addMerit(a, n, msg){
  a.god.incense += n;
  localStorage.setItem(LS_KEY, JSON.stringify(gods));
  pushWorship(a.god, n);
  sortGods();
  gods.forEach((g,rank)=>{
    const ag = altarGroups.find(x=>x.god===g);
    ag.target = rankPos(rank);
    ag.plaque.material.map = plaqueTex(g, rank);
    ag.plaque.material.map.needsUpdate = true;
  });
  refreshRank();
  toast.textContent = msg;
  toast.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> toast.style.opacity = 0, 1600);
}
// 上三炷香：香插入香炉并常驻，烟起
const stickBodyMat = new THREE.MeshStandardMaterial({ color:0x8a3020, roughness:.8 });
const emberMat = new THREE.MeshBasicMaterial({ color:0xff6a20 });
function riteIncense(a){
  const bp = a.grp.userData.burnerLocal.clone().applyMatrix4(a.grp.matrixWorld);
  for (let i=0;i<3;i++){
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.5,6), stickBodyMat);
    body.position.y = .25; g.add(body);
    const ember = new THREE.Mesh(new THREE.SphereGeometry(.02,8,6), emberMat);
    ember.position.y = .52; g.add(ember);
    const tx = bp.x+(i-1)*.055, tz = bp.z+(i-1)*.02;
    g.position.set(tx, bp.y+.85, tz);
    g.rotation.z = (Math.random()-.5)*.16; g.rotation.x = (Math.random()-.5)*.16;
    scene.add(g);
    let t = 0, delay = i*.18;
    anims.push({ update(dt){
      t += dt;
      const k = Math.min(1, Math.max(0, (t-delay)/.7));
      g.position.y = bp.y+.85 - k*.72;
      if (k>=1 && !g.userData.done){ g.userData.done = true; puff(tx, bp.y+.35, tz, 2, .1); }
      return !(k>=1);   // 香常驻炉中，动画结束即移出更新队列
    }});
  }
  setTimeout(()=> addMerit(a, 3, `🕯 三炷清香敬 ${a.god.name} · 香火 +3`), 900);
}
// 一揖三叩：镜头三叩首
let bowAnim = null;
function riteBow(a){
  if (bowAnim) return;
  const base = pitch;
  let t = 0;
  bowAnim = { update(dt){
    t += dt;
    const T = 2.1;
    if (t >= T){ pitch = base; bowAnim = null; addMerit(a, 1, `🙏 一揖三叩 · ${a.god.name} 香火 +1`); return false; }
    // 三次下拜：sin 波三个周期取绝对值
    pitch = base - Math.abs(Math.sin(t/T*Math.PI*3)) * .55;
    return true;
  }};
  anims.push(bowAnim);
}
// 随喜高香：金币抛入功德箱
function riteDonate(a){
  const boxWorld = new THREE.Vector3(.85,.45,.9).multiplyScalar(a.S ?? 1).applyMatrix4(a.grp.matrixWorld);
  const start = camera.position.clone().add(new THREE.Vector3(Math.sin(yaw)*-1,-.2,Math.cos(yaw)*-1));
  const coin = new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.018,20), goldMat);
  scene.add(coin);
  let t = 0;
  anims.push({ update(dt){
    t += dt;
    const k = Math.min(1, t/.75);
    coin.position.lerpVectors(start, boxWorld, k);
    coin.position.y += Math.sin(k*Math.PI)*.9;   // 抛物线
    coin.rotation.x += dt*12;
    if (k>=1){
      scene.remove(coin); coin.geometry.dispose();
      puff(boxWorld.x, boxWorld.y+.2, boxWorld.z, 2, .08);
      addMerit(a, 13, `🧧 随喜十三炷高香 · ${a.god.name} 功德圆满 +13`);
      return false;
    }
    return true;
  }});
}
// 参拜菜单
const actions = document.getElementById("actions");
let currentAltar = null;
actions.querySelectorAll("button").forEach(btn=>{
  btn.onclick = () => {
    actions.style.display = "none";
    if (!currentAltar) return;
    if (btn.dataset.act === "incense") riteIncense(currentAltar);
    if (btn.dataset.act === "bow") riteBow(currentAltar);
    if (btn.dataset.act === "donate") riteDonate(currentAltar);
  };
});

let downXY = null;
renderer.domElement.addEventListener("pointerdown", e => downXY = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {
  if (!downXY) return;
  const moved = Math.hypot(e.clientX-downXY[0], e.clientY-downXY[1]);
  downXY = null;
  if (moved > 6) return;   // 拖动不算点击
  const ndc = new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc, camera);
  for (const a of altarGroups) {
    if (ray.intersectObject(a.grp, true).length) {
      currentAltar = a;
      actions.querySelector(".who").textContent = `参拜 · ${a.god.name}`;
      actions.style.display = "flex";
      actions.style.left = Math.min(e.clientX+14, innerWidth-190)+"px";
      actions.style.top  = Math.min(e.clientY-20, innerHeight-190)+"px";
      return;
    }
  }
  actions.style.display = "none";
});

// ── 控制（沿用画廊）──
let yaw = 0, pitch = 0;
const keys = {};
addEventListener("keydown", e => keys[e.code]=true);
addEventListener("keyup",   e => keys[e.code]=false);
let dragging=false, px=0, py=0;
const cv = renderer.domElement;
cv.addEventListener("pointerdown", e=>{ dragging=true; px=e.clientX; py=e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e=>{
  if(!dragging) return;
  yaw -= (e.clientX-px)*.0042; pitch -= (e.clientY-py)*.0032;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
  px=e.clientX; py=e.clientY;
});
cv.addEventListener("pointerup", ()=> dragging=false);
const joy = document.getElementById("joy");
const knob = joy.querySelector(".knob");
let joyVec = {x:0,y:0};
joy.addEventListener("pointerdown", e=>{ joy.setPointerCapture(e.pointerId); moveKnob(e); e.stopPropagation(); });
joy.addEventListener("pointermove", e=>{ if(joy.hasPointerCapture(e.pointerId)) moveKnob(e); });
joy.addEventListener("pointerup", ()=>{ joyVec={x:0,y:0}; knob.style.transform="translate(-50%,-50%)"; });
function moveKnob(e){
  const r = joy.getBoundingClientRect();
  let dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2);
  const len = Math.hypot(dx,dy), max = r.width/2-20;
  if(len>max){ dx*=max/len; dy*=max/len; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyVec = { x:dx/max, y:dy/max };
}

const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05);
  const speed = keys.ShiftLeft||keys.ShiftRight? 9: 4.8;
  let fw=0, st=0;
  if(keys.KeyW||keys.ArrowUp) fw+=1;
  if(keys.KeyS||keys.ArrowDown) fw-=1;
  if(keys.KeyA||keys.ArrowLeft) st-=1;
  if(keys.KeyD||keys.ArrowRight) st+=1;
  fw += -joyVec.y; st += joyVec.x;
  const sin=Math.sin(yaw), cos=Math.cos(yaw);
  camera.position.x += (sin*-fw+cos*st)*speed*dt;
  camera.position.z += (cos*-fw-sin*st)*speed*dt;
  camera.position.x = Math.max(-HALL_W/2+.8, Math.min(HALL_W/2-.8, camera.position.x));
  camera.position.z = Math.max(-HALL_D/2+1.2, Math.min(HALL_D/2-1.2, camera.position.z));
  camera.rotation.order="YXZ"; camera.rotation.y=yaw; camera.rotation.x=pitch;
  // 神龛平滑挪位
  for (const a of altarGroups) {
    a.grp.position.x += (a.target.x - a.grp.position.x)*Math.min(1, dt*2.5);
    a.grp.position.z += (a.target.z - a.grp.position.z)*Math.min(1, dt*2.5);
    a.grp.rotation.y += (a.target.ry - a.grp.rotation.y)*Math.min(1, dt*2.5);
  }
  // 参拜动画
  for (let i=anims.length-1;i>=0;i--){ if (!anims[i].update(dt)) anims.splice(i,1); }
  // 烟雾更新
  for (let i=smokes.length-1;i>=0;i--){
    const k = smokes[i]; k.t += dt;
    k.s.position.y += k.vy*dt;
    k.s.material.opacity = .5*(1-k.t/k.life);
    const sc = k.s.scale.x + dt*.25; k.s.scale.set(sc,sc,1);
    if (k.t>=k.life){ scene.remove(k.s); k.s.material.dispose(); smokes.splice(i,1); }
  }
  renderer.render(scene, camera);
}
tick();
addEventListener("resize", ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
// 就绪即揭幕（无外部图片）
requestAnimationFrame(()=>{ const el=document.getElementById("loading"); el.style.opacity=0; setTimeout(()=>el.remove(),900); });
</script>
